<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BARAKAH</title><style>body{text-align:center;font-family:Arial;padding:20px}img{width:95%;max-width:360px;border-radius:12px}button{background:#000;color:#fff;padding:16px 30px;border:0;border-radius:8px;width:95%;max-width:360px;font-size:19px}input{padding:13px;width:90%;max-width:340px;margin:6px;border:1px solid #ccc;border-radius:8px}</style></head><body>
